# FitCheck AI - Docker Compose Configuration (Development with Hot Reload)
#
# NOT the standard local dev workflow - AGENTS.md's Non-negotiables state
# "Never run the project using Docker for local development" (the team uses
# a hosted Supabase instance + native uvicorn/flutter run instead). This
# file is kept for container-based workflows only (e.g. CI parity checks);
# if you're setting up local dev, follow AGENTS.md instead of
# `docker-compose up --build`.

services:
  # ============================================================================
  # Backend Service - FastAPI with Hot Reload
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: fitcheck-backend
    ports:
      - "8000:8000"
    # The root .env is gitignored, so a fresh clone has no .env. `required:
    # false` keeps `docker compose up` working anyway (backend starts with
    # whatever it is given and fails loudly at request time on missing
    # secrets). To run with real secrets, copy the template first:
    #   cp backend/.env.example .env
    #   # then fill in the values (hosted Supabase credentials, JWT secret, ...)
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8000
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend:/app
      - /app/__pycache__
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - fitcheck-network

  # ============================================================================
  # Frontend Service - React + Vite Dev Server with Hot Reload
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: fitcheck-frontend
    ports:
      - "3000:3000"
    # VITE_* values are compile-time constants: setting them here at runtime
    # does nothing for a static `vite build`. The production image
    # (frontend/Dockerfile) reads them as build args instead — pass them
    # with `docker compose build --build-arg VITE_SUPABASE_URL=... ...` or:
    #   build:
    #     context: ./frontend
    #     args:
    #       VITE_SUPABASE_URL: https://your-project.supabase.co
    #       VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_...
    #       VITE_API_BASE_URL: ""
    #       VITE_PUBLIC_POSTHOG_KEY: ""
    # The dev server below proxies /api to the backend on :8000, so no API
    # URL env is needed for the dev workflow.
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - fitcheck-network

networks:
  fitcheck-network:
    driver: bridge
