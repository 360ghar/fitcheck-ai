  <script>
    (function () {
      var build = function () {
        if (typeof gsap === "undefined" || !gsap.timeline) {
          setTimeout(build, 20);
          return;
        }

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["01-morning-panic"] = tl;

        // One beat array drives every entrance (kinetic-beat-slam doctrine).
        var BEATS = {
          every: 0.06,
          morning: 0.4,
          finn: 0.44,
          cut1: 0.9,
          two: 0.95,
          hundred: 1.2,
          clothes: 1.45,
          confetti: [0.98, 1.22, 1.46],
          swap: 2.05,
          swapTo: 2.12,
          swapWear: 2.19,
          jitter: 2.6,
          bob: 3.2,
        };

        /* ——— Scene 1 (0–0.9s): kinetic beat-slam, two distinct entrances ——— */
        // "Every" — scale + blur slam (power4.out hard hit)
        tl.fromTo(
          "#mp-w-every",
          { scale: 1.5, filter: "blur(10px)", opacity: 0 },
          { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.4, ease: "power4.out" },
          BEATS.every
        );
        // "morning" — side snap (expo.out whip-in, distinct axis)
        tl.fromTo(
          "#mp-w-morning",
          { x: -260, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.38, ease: "expo.out" },
          BEATS.morning
        );

        // Finn springs in from the bottom edge (playful pop — the one overshoot)
        tl.fromTo(
          "#mp-finn-inner",
          { y: 430, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
          BEATS.finn
        );
        tl.fromTo(
          "#mp-finn-inner",
          { scale: 0.55, transformOrigin: "50% 100%" },
          { scale: 1, transformOrigin: "50% 100%", duration: 0.55, ease: "back.out(1.8)" },
          BEATS.finn
        );

        // Wallpaper pills settle in on the open (quiet, smooth power3 tails)
        tl.fromTo("#mp-p1", { scale: 0.5, rotation: -26, opacity: 0 }, { scale: 1, rotation: -14, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.04);
        tl.fromTo("#mp-p2", { scale: 0.5, rotation: 0, opacity: 0 }, { scale: 1, rotation: 12, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.12);
        tl.fromTo("#mp-p3", { scale: 0.5, rotation: -22, opacity: 0 }, { scale: 1, rotation: -10, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.2);
        tl.fromTo("#mp-p4", { scale: 0.5, rotation: -24, opacity: 0 }, { scale: 1, rotation: -12, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.28);

        /* ——— Scene 1 → 2 seam: hard cut (discrete state jump, no exit tween) ——— */
        tl.set("#mp-line1", { opacity: 0 }, BEATS.cut1);

        /* ——— Scene 2 (0.9–2s): "Two hundred clothes" per-word staggered ——— */
        // "Two" — scale + blur slam
        tl.fromTo(
          "#mp-w-two",
          { scale: 1.35, filter: "blur(10px)", opacity: 0 },
          { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.42, ease: "power4.out" },
          BEATS.two
        );
        // "hundred" — rise + blur
        tl.fromTo(
          "#mp-w-hundred",
          { y: 56, filter: "blur(10px)", opacity: 0 },
          { y: 0, filter: "blur(0px)", opacity: 1, duration: 0.46, ease: "power3.out" },
          BEATS.hundred
        );
        // "clothes" — side snap + blur
        tl.fromTo(
          "#mp-w-clothes",
          { x: 200, filter: "blur(10px)", opacity: 0 },
          { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.42, ease: "expo.out" },
          BEATS.clothes
        );

        // Three tilted floating pills drift in as wardrobe confetti (flat, smooth)
        tl.fromTo("#mp-p5", { x: 140, y: -90, rotation: -26, opacity: 0 }, { x: 0, y: 0, rotation: -8, opacity: 1, duration: 0.55, ease: "power3.out" }, BEATS.confetti[0]);
        tl.fromTo("#mp-p6", { x: -140, y: -70, rotation: 28, opacity: 0 }, { x: 0, y: 0, rotation: 16, opacity: 1, duration: 0.55, ease: "power3.out" }, BEATS.confetti[1]);
        tl.fromTo("#mp-p7", { x: -120, y: 90, rotation: 22, opacity: 0 }, { x: 0, y: 0, rotation: 8, opacity: 1, duration: 0.55, ease: "power3.out" }, BEATS.confetti[2]);

        /* ——— Scene 2 → 3 seam: hard-cut word-swap (discrete-text-sequence) ——— */
        tl.set("#mp-line-a", { opacity: 0 }, BEATS.swap);

        /* ——— Scene 3 (2–6.02s): "Nothing to wear" scale-pop settle (power3) ——— */
        // Each word appears instantly (the hard cut) then settles on a power3 long tail.
        tl.set("#mp-w-nothing", { opacity: 1 }, BEATS.swap);
        tl.fromTo("#mp-w-nothing", { scale: 0.94 }, { scale: 1, duration: 0.5, ease: "power3.out" }, BEATS.swap);
        tl.set("#mp-w-to", { opacity: 1 }, BEATS.swapTo);
        tl.fromTo("#mp-w-to", { scale: 0.94 }, { scale: 1, duration: 0.5, ease: "power3.out" }, BEATS.swapTo);
        tl.set("#mp-w-wear", { opacity: 1 }, BEATS.swapWear);
        tl.fromTo("#mp-w-wear", { scale: 0.94 }, { scale: 1, duration: 0.5, ease: "power3.out" }, BEATS.swapWear);

        // Finn bobs once — a single finite, bounded gesture
        tl.to("#mp-finn-inner", { y: -16, duration: 0.28, ease: "power2.out" }, BEATS.bob);
        tl.to("#mp-finn-inner", { y: 0, duration: 0.38, ease: "power2.inOut" }, BEATS.bob + 0.28);

        // Hold the read: stillness, no drift — only a subtle deterministic sine jitter
        var jitEl = document.getElementById("mp-stack-inner");
        var jit = { p: 0 };
        tl.to(
          jit,
          {
            p: Math.PI * 2 * 2.0,
            duration: 3.42,
            ease: "none",
            onUpdate: function () {
              var x = 2.0 * Math.sin(jit.p);
              var y = 1.3 * Math.sin(jit.p * 1.31);
              jitEl.style.transform = "translate3d(" + x.toFixed(2) + "px," + y.toFixed(2) + "px,0)";
            },
          },
          BEATS.jitter
        );

        tl.seek(0);
      };
      build();
    })();
  </script>
