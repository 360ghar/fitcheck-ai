  <script>
    (function () {
      var build = function () {
        if (typeof gsap === "undefined" || !gsap.timeline) {
          setTimeout(build, 20);
          return;
        }

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["06-outfit-builder"] = tl;

        var BEATS = {
          card: 0.06,
          chips: 0.2,
          chipStagger: 0.15,
          finn: 0.4,
          tap: 2.3,
          generate: 2.55,
          snap: 2.75,
          dots: 2.9,
          doll: 3.0,
          dollDraw: 1.2,
          garm1: 3.4,
          garm2: 3.7,
          look: 3.75,
          jitter: 4.4,
        };

        /* ——— Scene 1 (0–2.5s): the builder card opens, chips stack in ——— */
        tl.fromTo(
          "#ob-card",
          { scale: 0.94, y: 24, opacity: 0 },
          { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
          BEATS.card
        );

        // Three item chips assemble into a stack (center-outward expansion).
        var chipTops = [400, 545, 690];
        var cardCenterY = 260 + 490;
        for (var c = 0; c < 3; c++) {
          (function (el, top, idx) {
            var dy = top + 65 - cardCenterY;
            tl.fromTo(
              el,
              { y: -dy, scale: 0.3, opacity: 0 },
              { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
              BEATS.chips + idx * BEATS.chipStagger
            );
          })(document.getElementById("ob-chip-" + (c + 1)), chipTops[c], c);
        }

        // Finn steps in at the bottom-left (his tap fires later, in scene 2's lead).
        tl.fromTo(
          "#ob-finn-inner",
          { y: 80, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
          BEATS.finn
        );

        // Wallpaper pills settle in on the open (quiet power3 tails).
        tl.fromTo("#ob-wp1", { scale: 0.5, rotation: -22, opacity: 0 }, { scale: 1, rotation: -10, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.05);
        tl.fromTo("#ob-wp2", { scale: 0.5, rotation: 20, opacity: 0 }, { scale: 1, rotation: 11, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.13);
        tl.fromTo("#ob-wp3", { scale: 0.5, rotation: -18, opacity: 0 }, { scale: 1, rotation: -9, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.21);
        tl.fromTo("#ob-wp4", { scale: 0.5, rotation: 24, opacity: 0 }, { scale: 1, rotation: 12, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.29);

        /* ——— Scene 2 (2.6–2.8s): Finn taps the stack; GENERATE springs in ——— */
        // The cameo tap: one bounded press on the stack (press-release-spring).
        tl.to("#ob-chip-1", { scale: 0.96, transformOrigin: "50% 50%", duration: 0.08, ease: "power2.in" }, BEATS.tap);
        tl.to("#ob-chip-1", { scale: 1.03, duration: 0.1, ease: "power2.out" }, BEATS.tap + 0.08);
        tl.to("#ob-chip-1", { scale: 1, duration: 0.12, ease: "power3.out" }, BEATS.tap + 0.18);
        tl.to("#ob-chip-2", { scale: 0.96, transformOrigin: "50% 50%", duration: 0.08, ease: "power2.in" }, BEATS.tap + 0.1);
        tl.to("#ob-chip-2", { scale: 1, duration: 0.16, ease: "power3.out" }, BEATS.tap + 0.18);

        // The jade GENERATE pill springs in (spring-pop entrance).
        tl.fromTo(
          "#ob-generate",
          { scale: 0.4, transformOrigin: "50% 50%", opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.7)" },
          BEATS.generate
        );

        // On "one tap": the press-release spring fires on the button.
        tl.to("#ob-generate", { scale: 0.86, transformOrigin: "50% 50%", duration: 0.09, ease: "power2.in" }, BEATS.snap);
        tl.to("#ob-generate", { scale: 1.05, duration: 0.12, ease: "power2.out" }, BEATS.snap + 0.09);
        tl.to("#ob-generate", { scale: 1, duration: 0.14, ease: "power3.out" }, BEATS.snap + 0.21);

        /* ——— Scene 3 (2.9–6.45s): thinking dots, the look blooms, "the look" slams ——— */
        // Thinking dots: a finite, bounded double pulse (no infinite loop).
        for (var d = 0; d < 3; d++) {
          (function (el, idx) {
            var base = BEATS.dots + idx * 0.12;
            tl.to(el, { opacity: 0.85, duration: 0.22, ease: "power1.inOut" }, base);
            tl.to(el, { opacity: 0.3, duration: 0.22, ease: "power1.inOut" }, base + 0.22);
            tl.to(el, { opacity: 0.85, duration: 0.22, ease: "power1.inOut" }, base + 0.44);
            tl.to(el, { opacity: 0.25, duration: 0.26, ease: "power2.out" }, base + 0.66);
          })(document.getElementById("ob-dot-" + (d + 1)), d);
        }

        // The paper-doll silhouette draws itself in (svg-path-draw: dashoffset → 0).
        var dollPaths = document.querySelectorAll("#ob-doll path, #ob-doll line");
        for (var p = 0; p < dollPaths.length; p++) {
          (function (el, idx) {
            tl.to(
              el,
              { strokeDashoffset: 0, duration: BEATS.dollDraw, ease: "power2.inOut" },
              BEATS.doll + idx * 0.18
            );
          })(dollPaths[p], p);
        }

        // The stacked pills reappear as the garment's layers, dropping onto the silhouette.
        tl.fromTo("#ob-garm-1", { y: -70, scale: 0.7, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, BEATS.garm1);
        tl.fromTo("#ob-garm-2", { y: -90, scale: 0.7, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, BEATS.garm2);

        // The dots fade as the look lands.
        tl.to(".ob-dot", { opacity: 0, duration: 0.3, ease: "power2.out" }, BEATS.garm2 + 0.1);

        // "the look" slams in as a Bodoni headline (kinetic beat-slam: scale + blur settle).
        tl.fromTo(
          "#ob-look",
          { scale: 1.35, filter: "blur(14px)", opacity: 0 },
          { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power3.out" },
          BEATS.look
        );

        // Hold the read: stillness — only a subtle deterministic jitter on the stage.
        var stageEl = document.getElementById("ob-stage");
        var jit = { p: 0 };
        tl.to(
          jit,
          {
            p: Math.PI * 2 * 1.5,
            duration: 6.45 - BEATS.jitter,
            ease: "none",
            onUpdate: function () {
              var x = 1.4 * Math.sin(jit.p);
              var y = 1.0 * Math.sin(jit.p * 1.31);
              stageEl.style.transform = "translate3d(" + x.toFixed(2) + "px," + y.toFixed(2) + "px,0)";
            },
          },
          BEATS.jitter
        );

        tl.seek(0);
      };
      build();
    })();
