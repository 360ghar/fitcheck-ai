  <script>
    (function () {
      var build = function () {
        if (typeof gsap === "undefined" || !gsap.timeline) {
          setTimeout(build, 20);
          return;
        }

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["04-snap-catalog"] = tl;

        var STATUS = ["Uploading…", "Extracting items…", "3 of 6 processed"];
        var BEATS = {
          card: 0.06,
          shutter: 0.1,
          snap: 0.3,
          tiles: 0.45,
          tileStagger: 0.18,
          status1: 2.2,
          status2: 2.55,
          status3: 2.95,
          barEnd: 3.35,
          item1: 3.38,
          item2: 3.79,
          item3: 4.36,
          finn: 4.6,
          badge: 5.2,
          jitter: 5.3,
        };

        /* ——— Scene 1 (0–2.1s): the camera card opens, the shutter fires, tiles cascade in ——— */
        tl.fromTo(
          "#sn-card",
          { scale: 0.94, y: 24, opacity: 0 },
          { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
          BEATS.card
        );

        // The jade shutter pill springs in (spring-pop entrance).
        tl.fromTo(
          "#sn-shutter",
          { scale: 0.4, transformOrigin: "50% 50%", opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.7)" },
          BEATS.shutter
        );

        // On "snap": a press-release spring fires (press-release-spring).
        tl.to("#sn-shutter", { scale: 0.86, transformOrigin: "50% 50%", duration: 0.09, ease: "power2.in" }, BEATS.snap);
        tl.to("#sn-shutter", { scale: 1.05, duration: 0.12, ease: "power2.out" }, BEATS.snap + 0.09);
        tl.to("#sn-shutter", { scale: 1, duration: 0.14, ease: "power3.out" }, BEATS.snap + 0.21);

        // Three photo tiles cascade into the card (center-outward expansion: from the card's center at 30% scale).
        var tileTops = [410, 580, 750];
        var cardCenterY = 230 + 400;
        for (var t = 0; t < 3; t++) {
          (function (el, top, idx) {
            var dy = top + 75 - cardCenterY;
            tl.fromTo(
              el,
              { y: -dy, scale: 0.3, opacity: 0 },
              { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
              BEATS.tiles + idx * BEATS.tileStagger
            );
          })(document.getElementById("sn-tile-" + (t + 1)), tileTops[t], t);
        }

        // Wallpaper pills settle in on the open (quiet power3 tails).
        tl.fromTo("#sn-wp1", { scale: 0.5, rotation: -22, opacity: 0 }, { scale: 1, rotation: -10, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.05);
        tl.fromTo("#sn-wp2", { scale: 0.5, rotation: 20, opacity: 0 }, { scale: 1, rotation: 11, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.13);
        tl.fromTo("#sn-wp3", { scale: 0.5, rotation: -18, opacity: 0 }, { scale: 1, rotation: -9, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.21);
        tl.fromTo("#sn-wp4", { scale: 0.5, rotation: 24, opacity: 0 }, { scale: 1, rotation: 12, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.29);

        /* ——— Scene 2 (2.2–3.4s): honest phase theater — the status header hard-cut swaps, the bar fills ——— */
        var statusEl = document.getElementById("sn-status");
        function swapStatus(at, text) {
          tl.call(function () { statusEl.textContent = text; }, null, at);
          tl.fromTo(statusEl, { opacity: 0.35 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, at);
        }
        swapStatus(BEATS.status1, STATUS[0]);
        swapStatus(BEATS.status2, STATUS[1]);
        swapStatus(BEATS.status3, STATUS[2]);

        // The bar-track fills in jade across the phase (stat-bars-and-fills, left origin).
        tl.fromTo("#sn-barfill", { scaleX: 0 }, { scaleX: 1, duration: BEATS.barEnd - BEATS.status1, ease: "power3.out" }, BEATS.status1);

        /* ——— Scene 3 (3.5–8.18s): the receipt cascades — item pills check off on their VO cues ——— */
        var itemAt = [BEATS.item1, BEATS.item2, BEATS.item3];
        for (var i = 0; i < 3; i++) {
          (function (itemEl, tickEl, chipEl, at) {
            // The pill rises in (power3 settle).
            tl.fromTo(itemEl, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, at);
            // Its check pops off a beat later (spring-pop).
            tl.fromTo(tickEl, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.28, ease: "back.out(1.7)" }, at + 0.14);
            // Its candy attribute chip sprouts (spring-pop).
            tl.fromTo(chipEl, { scale: 0.5, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.26, ease: "back.out(1.6)" }, at + 0.2);
          })(
            document.getElementById("sn-item-" + (i + 1)),
            document.querySelectorAll("#sn-item-" + (i + 1) + " .sn-tick")[0],
            document.querySelectorAll("#sn-item-" + (i + 1) + " .sn-chip")[0],
            itemAt[i]
          );
        }

        // Finn steps in, holding the moment; his checkmark badge pops.
        tl.fromTo("#sn-finn-inner", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, BEATS.finn);
        tl.fromTo("#sn-badge", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(1.7)" }, BEATS.badge);

        // Hold the read: stillness — only a subtle deterministic sine jitter on the receipt.
        var receiptEl = document.getElementById("sn-receipt");
        var jit = { p: 0 };
        tl.to(
          jit,
          {
            p: Math.PI * 2 * 2.0,
            duration: 8.18 - BEATS.jitter,
            ease: "none",
            onUpdate: function () {
              var x = 1.6 * Math.sin(jit.p);
              var y = 1.2 * Math.sin(jit.p * 1.27);
              receiptEl.style.transform = "translate3d(" + x.toFixed(2) + "px," + y.toFixed(2) + "px,0)";
            },
          },
          BEATS.jitter
        );

        tl.seek(0);
      };
      build();
    })();
  </script>
