  <script>
    (function () {
      var build = function () {
        if (typeof gsap === "undefined" || !gsap.timeline) {
          setTimeout(build, 20);
          return;
        }

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["07-calendar-weather"] = tl;

        var BEATS = {
          headline: 0.08,
          tags: 0.5,
          calGlow: 1.4,
          wxGlow: 2.16,
          panStart: 1.0,
          panEnd: 2.8,
          wxPops: 1.0,
          wxPopStep: 0.26,
          meet: 2.95,
          tile: 3.25,
          never: 2.9,
          jitter: 3.6,
        };

        /* ——— Scene 1 (0–0.9s): the headline reveals per-word on its VO cues ——— */
        var headWords = document.querySelectorAll("#cw-headline .cw-w");
        var headAt = [0.08, 0.25, 0.44];
        for (var h = 0; h < headWords.length; h++) {
          (function (el, at) {
            tl.fromTo(el, { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, at);
          })(headWords[h], headAt[h]);
        }

        // The CALENDAR / WEATHER tags settle in (quiet power3 tails).
        tl.fromTo("#cw-tag-cal", { scale: 0.6, rotation: -8, opacity: 0 }, { scale: 1, rotation: -3, opacity: 1, duration: 0.4, ease: "power3.out" }, BEATS.tags);
        tl.fromTo("#cw-tag-wx", { scale: 0.6, rotation: 8, opacity: 0 }, { scale: 1, rotation: 3, opacity: 1, duration: 0.4, ease: "power3.out" }, BEATS.tags + 0.12);

        /* ——— Scene 2 (1–2.8s): the camera pans the week down to Thursday ——— */
        // The strip starts with MON centered; the pan travels until THU is centered.
        tl.fromTo("#cw-strip", { y: 473 }, { y: -187, duration: BEATS.panEnd - BEATS.panStart, ease: "power3.inOut" }, BEATS.panStart);

        // Each station's weather pill pops in as the camera centers it (spring-pop).
        for (var w = 0; w < 7; w++) {
          (function (el, idx) {
            tl.fromTo(
              el,
              { scale: 0.4, transformOrigin: "50% 50%", opacity: 0 },
              { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.6)" },
              BEATS.wxPops + idx * BEATS.wxPopStep
            );
          })(document.getElementById("cw-wx-" + w), w);
        }

        // The labels glow on their spoken cues (keyword glow: a jade halo, two bounded pulses).
        function tagGlow(tagEl, at) {
          var halo = tagEl.querySelector(".cw-tag-glow");
          tl.fromTo(halo, { opacity: 0 }, { opacity: 0.9, duration: 0.14, ease: "power1.out" }, at);
          tl.to(halo, { opacity: 0.15, duration: 0.2, ease: "power2.out" }, at + 0.14);
          tl.to(halo, { opacity: 0.7, duration: 0.14, ease: "power1.out" }, at + 0.34);
          tl.to(halo, { opacity: 0, duration: 0.3, ease: "power2.out" }, at + 0.48);
          tl.fromTo(tagEl, { scale: 1 }, { scale: 1.06, transformOrigin: "50% 50%", duration: 0.14, ease: "power2.out" }, at);
          tl.to(tagEl, { scale: 1, duration: 0.24, ease: "power3.out" }, at + 0.14);
        }
        tagGlow(document.getElementById("cw-tag-cal"), BEATS.calGlow);
        tagGlow(document.getElementById("cw-tag-wx"), BEATS.wxGlow);

        /* ——— Scene 3 (2.9–6.51s): the camera locks on THU — the consequence lands ——— */
        // THU's meeting pill and styled outfit tile pop in beside the weather pill.
        tl.fromTo("#cw-meet", { scale: 0.4, transformOrigin: "50% 50%", opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "back.out(1.7)" }, BEATS.meet);
        tl.fromTo("#cw-outfit-tile", { scale: 0.5, rotation: -10, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.32, ease: "back.out(1.5)" }, BEATS.tile);

        // The consequence highlight: "never freeze in a meeting" lands on its cue.
        tl.fromTo("#cw-never", { y: 30, scale: 0.92, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, BEATS.never);

        // Hold the read: stillness — only a subtle deterministic jitter on the strip.
        var stripEl = document.getElementById("cw-strip");
        var jit = { p: 0 };
        tl.to(
          jit,
          {
            p: Math.PI * 2 * 1.4,
            duration: 6.51 - BEATS.jitter,
            ease: "none",
            onUpdate: function () {
              var x = 1.3 * Math.sin(jit.p);
              var y = 0.9 * Math.sin(jit.p * 1.27);
              // Compose with the finished pan offset (−187) so the jitter never fights the camera.
              stripEl.style.transform = "translate3d(" + x.toFixed(2) + "px," + (-187 + y).toFixed(2) + "px,0)";
            },
          },
          BEATS.jitter
        );

        tl.seek(0);
      };
      build();
    })();
  </script>
