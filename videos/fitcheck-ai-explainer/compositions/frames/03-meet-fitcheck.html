  <script>
    (function () {
      var build = function () {
        if (typeof gsap === "undefined" || !gsap.timeline) {
          setTimeout(build, 20);
          return;
        }

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["03-meet-fitcheck"] = tl;

        // Deterministic scatter origins for the eight letter chips (depth-scatter-assemble).
        var SCATTER = [
          { x: -350, y: -170, r: -26, s: 0.55 },
          { x: 310,  y: -230, r: 20,  s: 0.5 },
          { x: -270, y: 190,  r: 14,  s: 0.6 },
          { x: 370,  y: 150,  r: -18, s: 0.55 },
          { x: -420, y: 30,   r: 22,  s: 0.6 },
          { x: 250,  y: -70,  r: -24, s: 0.5 },
          { x: -180, y: -280, r: 16,  s: 0.6 },
          { x: 420,  y: 260,  r: -14, s: 0.55 },
        ];
        var CHIP_BG = ["#078675", "#74DEC0", "#51D6B0", "#9BFAED", "#74DEC0", "#89F9EA", "#5DF7E2", "#51D6B0"];

        var BEATS = {
          chips: 0.06,
          chipStagger: 0.06,
          chipFly: 0.38,
          aipill: 1.1,
          finnIn: 1.05,
          wave: 1.55,
          subline: 1.5,
          subWords: [1.5, 1.72, 2.26, 2.89, 3.06],
          jitter: 3.4,
        };

        /* ——— Scene 1 (0–1s): scattered paper chips tumble in and assemble into the wordmark ——— */
        var letters = document.querySelectorAll(".mk-lw");
        for (var i = 0; i < letters.length; i++) {
          (function (el, sc, bg, idx) {
            var start = BEATS.chips + idx * BEATS.chipStagger;
            // Chip + letter fly in together from a deterministic edge scatter (power3 settle).
            tl.fromTo(
              el,
              { x: sc.x, y: sc.y, rotation: sc.r, scale: sc.s, opacity: 0 },
              { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1, duration: BEATS.chipFly, ease: "power3.out" },
              start
            );
            // On landing, the paper pill dissolves — bare Bodoni letters remain (the assemble payoff).
            var chip = el.querySelector(".mk-chip");
            tl.to(
              chip,
              { backgroundColor: "rgba(116,222,192,0)", borderColor: "rgba(30,30,30,0)", duration: 0.3, ease: "power2.out" },
              start + BEATS.chipFly + 0.02
            );
          })(letters[i], SCATTER[i], CHIP_BG[i], i);
        }

        // Wallpaper pills settle in on the open (quiet power3 tails).
        tl.fromTo("#mk-wp1", { scale: 0.5, rotation: -24, opacity: 0 }, { scale: 1, rotation: -12, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.04);
        tl.fromTo("#mk-wp2", { scale: 0.5, rotation: 18, opacity: 0 }, { scale: 1, rotation: 10, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.12);
        tl.fromTo("#mk-wp3", { scale: 0.5, rotation: -18, opacity: 0 }, { scale: 1, rotation: -8, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.2);
        tl.fromTo("#mk-wp4", { scale: 0.5, rotation: 22, opacity: 0 }, { scale: 1, rotation: 12, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.28);
        tl.fromTo("#mk-wp5", { scale: 0.5, rotation: -14, opacity: 0 }, { scale: 1, rotation: -6, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.36);

        /* ——— Scene 2 (1.1–1.4s): the "AI" title-pill springs in; Finn steps forward ——— */
        tl.fromTo(
          "#mk-aipill",
          { scale: 0.4, transformOrigin: "50% 50%", opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(1.6)" },
          BEATS.aipill
        );

        tl.fromTo(
          "#mk-finn-inner",
          { y: 320, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
          BEATS.finnIn
        );

        // Finn waves once — a single finite, bounded gesture (rotation settles back to 0).
        tl.to("#mk-finn-inner", { rotation: -7, transformOrigin: "50% 92%", duration: 0.16, ease: "power1.out" }, BEATS.wave);
        tl.to("#mk-finn-inner", { rotation: 5, duration: 0.2, ease: "power1.inOut" }, BEATS.wave + 0.16);
        tl.to("#mk-finn-inner", { rotation: 0, duration: 0.24, ease: "power2.out" }, BEATS.wave + 0.36);

        /* ——— Scene 3 (1.5–5.79s): the sub-line pill lands, words rise on their VO cues ——— */
        tl.fromTo(
          "#mk-subline",
          { scale: 0.92, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
          BEATS.subline
        );
        var words = document.querySelectorAll(".mk-sw");
        for (var w = 0; w < words.length; w++) {
          (function (el, at) {
            tl.fromTo(el, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, at);
          })(words[w], BEATS.subWords[w]);
        }

        // Hold the read: stillness — only a subtle deterministic sine jitter on Finn.
        var finnSvg = document.getElementById("mk-finn-svg");
        var jit = { p: 0 };
        tl.to(
          jit,
          {
            p: Math.PI * 2 * 1.6,
            duration: 5.79 - BEATS.jitter,
            ease: "none",
            onUpdate: function () {
              var x = 1.5 * Math.sin(jit.p);
              var y = 1.1 * Math.sin(jit.p * 1.31);
              finnSvg.style.transform = "translate3d(" + x.toFixed(2) + "px," + y.toFixed(2) + "px,0)";
            },
          },
          BEATS.jitter
        );

        tl.seek(0);
      };
      build();
    })();
  </script>
