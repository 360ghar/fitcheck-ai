  <div
    id="root"
    data-composition-id="12-start-free"
    data-start="0"
    data-duration="8.53"
    data-width="1080"
    data-height="1920"
  >
    <!-- atmosphere ground -->
    <div class="clip" id="ct-bg" data-start="0" data-duration="8.53" data-track-index="0">
      <div class="ct-glow ct-glow-a"></div>
      <div class="ct-glow ct-glow-b"></div>
      <div class="ct-glow ct-glow-c"></div>

  <script>
    (function () {
      var build = function () {
        if (typeof gsap === "undefined" || !gsap.timeline) {
          setTimeout(build, 20);
          return;
        }

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["12-start-free"] = tl;

        var BEATS = {
          resting: 0.1,
          plus: 0.88,
          pro: 1.26,
          unlock1: 1.88,
          unlock2: 2.47,
          unlock3: 3.28,
          swap: 3.85,
          yearly: 3.95,
          press: 4.68,
          ripple: 4.75,
          jitter: 5.6,
        };

        /* ——— Scene 1 (0–1.4s): the resting "free" card; plus / pro satellites ——— */
        tl.fromTo(
          "#ct-resting",
          { scale: 0.92, y: 40, opacity: 0 },
          { scale: 1, y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
          BEATS.resting
        );
        tl.fromTo("#ct-tier-plus", { scale: 0.4, rotation: -8, transformOrigin: "50% 50%", opacity: 0 }, { scale: 1, rotation: -3, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, BEATS.plus);
        tl.fromTo("#ct-tier-pro", { scale: 0.4, rotation: 8, transformOrigin: "50% 50%", opacity: 0 }, { scale: 1, rotation: 3, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, BEATS.pro);

        /* ——— Scene 2 (1.5–3.9s): the three unlocks cascade in ——— */
        var unlockAt = [BEATS.unlock1, BEATS.unlock2, BEATS.unlock3];
        for (var u = 0; u < 3; u++) {
          (function (sel, at) {
            tl.fromTo(sel, { y: 44, scale: 0.85, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, at);
            var tick = sel.querySelector("path");
            tl.fromTo(tick, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.28, ease: "back.out(1.7)" }, at + 0.16);
          })("#ct-unlock-" + (u + 1), unlockAt[u]);
        }

        /* ——— Scene 3 (4–8.03s): the card condenses into the jade CTA (scale-swap) ——— */
        tl.to("#ct-resting", { scale: 0.7, opacity: 0, transformOrigin: "50% 50%", duration: 0.35, ease: "power2.in" }, BEATS.swap);
        tl.fromTo("#ct-cta", { scale: 0.7, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.5)" }, BEATS.swap + 0.05);

        // The yearly billing pill lands on "yearly".
        tl.fromTo("#ct-yearly", { y: 26, scale: 0.9, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, BEATS.yearly);

        // The press lands on "gets" — a press-release spring on the CTA.
        tl.to("#ct-cta", { scale: 0.9, transformOrigin: "50% 50%", duration: 0.1, ease: "power2.in" }, BEATS.press);
        tl.to("#ct-cta", { scale: 1.04, duration: 0.13, ease: "power2.out" }, BEATS.press + 0.1);
        tl.to("#ct-cta", { scale: 1, duration: 0.16, ease: "power3.out" }, BEATS.press + 0.23);

        // The confirm ripple expands and fades (finite, one ring).
        tl.fromTo(
          "#ct-ripple",
          { scale: 0.98, opacity: 0.55 },
          { scale: 1.14, opacity: 0, transformOrigin: "50% 50%", duration: 0.7, ease: "power2.out" },
          BEATS.ripple
        );

        // Hold the read: stillness — only a subtle deterministic jitter on the stage.
        var stageEl = document.getElementById("ct-stage-clip");
        var jit = { p: 0 };
        tl.to(
          jit,
          {
            p: Math.PI * 2 * 1.7,
            duration: 8.03 - BEATS.jitter,
            ease: "none",
            onUpdate: function () {
              var x = 1.4 * Math.sin(jit.p);
              var y = 1.0 * Math.sin(jit.p * 1.31);
              stageEl.style.transform = "translate3d(" + x.toFixed(2) + "px," + y.toFixed(2) + "px,0)";
            },
          },
          BEATS.jitter
        );

        tl.seek(0);
      };
      build();
    })();
  </script>
