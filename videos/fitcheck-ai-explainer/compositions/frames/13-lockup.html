  <script>
    (function () {
      var build = function () {
        if (typeof gsap === "undefined" || !gsap.timeline) {
          setTimeout(build, 20);
          return;
        }

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["13-lockup"] = tl;

        // Per-path draw lengths (viewBox units) — the real Facet F geometry.
        var DRAW = [
          { id: "#lk-draw-stem", len: 1700, at: 0.1 },
          { id: "#lk-draw-top", len: 1200, at: 0.28 },
          { id: "#lk-draw-crease", len: 480, at: 0.46 },
          { id: "#lk-draw-arm", len: 760, at: 0.64 },
        ];
        var FILL = [
          { id: "#lk-fill-stem", at: 0.6 },
          { id: "#lk-fill-top", at: 0.75 },
          { id: "#lk-fill-crease", at: 0.9 },
          { id: "#lk-fill-arm", at: 1.05 },
        ];

        var BEATS = {
          wordmark: 1.42,
          wordStagger: 0.045,
          ai: 1.85,
          finn: 1.35,
          wave: 1.5,
          signoff: 1.25,
          w0: 1.32,
          w1: 1.52,
          hl: 2.25,
          w2: 2.25,
          w3: 2.7,
          w4: 2.85,
          jitter: 3.2,
        };

        /* ——— Scene 1 (0–1.3s): the Facet F draws itself on (svg-path-draw) ——— */
        for (var d = 0; d < DRAW.length; d++) {
          (function (spec) {
            var el = document.querySelector(spec.id);
            el.style.strokeDasharray = spec.len;
            el.style.strokeDashoffset = spec.len;
            tl.to(el, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, spec.at);
          })(DRAW[d]);
        }
        for (var f = 0; f < FILL.length; f++) {
          (function (spec) {
            tl.to(spec.id, { opacity: 1, duration: 0.35, ease: "power2.out" }, spec.at);
          })(FILL[f]);
        }

        /* ——— Scene 2 (1.4–2.2s): the wordmark resolves; Finn waves ——— */
        for (var l = 0; l < 8; l++) {
          (function (idx) {
            tl.fromTo("#lk-l" + idx, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, BEATS.wordmark + idx * BEATS.wordStagger);
          })(l);
        }
        tl.fromTo("#lk-ai", { y: 30, scale: 0.6, transformOrigin: "50% 50%", opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, BEATS.ai);

        // Finn steps in and waves once — a single finite, bounded gesture.
        tl.fromTo("#lk-finn-inner", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, BEATS.finn);
        tl.to("#lk-finn-inner", { rotation: -7, transformOrigin: "50% 92%", duration: 0.16, ease: "power1.out" }, BEATS.wave);
        tl.to("#lk-finn-inner", { rotation: 5, duration: 0.2, ease: "power1.inOut" }, BEATS.wave + 0.16);
        tl.to("#lk-finn-inner", { rotation: 0, duration: 0.24, ease: "power2.out" }, BEATS.wave + 0.36);

        /* ——— Scene 3 (2.3–7.0s): the sign-off types on its VO cues ——— */
        tl.fromTo("#lk-signoff", { scale: 0.94, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, BEATS.signoff);
        var wAt = [BEATS.w0, BEATS.w1, BEATS.w2, BEATS.w3, BEATS.w4];
        var wIds = ["#lk-w0", "#lk-w1", "#lk-w2", "#lk-w3", "#lk-w4"];
        for (var w = 0; w < 5; w++) {
          (function (sel, at) {
            tl.fromTo(sel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power3.out" }, at);
          })(wIds[w], wAt[w]);
        }
        // The mint highlight wraps "decided in seconds" as it lands.
        tl.fromTo("#lk-hl", { scale: 0.85, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(1.6)" }, BEATS.hl);

        // Hold the read: stillness — only a subtle deterministic jitter on the mark.
        var markEl = document.getElementById("lk-mark-clip");
        var jit = { p: 0 };
        tl.to(
          jit,
          {
            p: Math.PI * 2 * 2.0,
            duration: 7.00 - BEATS.jitter,
            ease: "none",
            onUpdate: function () {
              var x = 1.4 * Math.sin(jit.p);
              var y = 1.0 * Math.sin(jit.p * 1.31);
              markEl.style.transform = "translate3d(" + x.toFixed(2) + "px," + y.toFixed(2) + "px,0)";
            },
          },
          BEATS.jitter
        );

        tl.seek(0);
      };
      build();
    })();
  </script>
