  <script>
    (function () {
      var build = function () {
        if (typeof gsap === "undefined" || !gsap.timeline) {
          setTimeout(build, 20);
          return;
        }

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["05-smart-wardrobe"] = tl;

        // Beats are keyed to the real voice timing (assets/voice/05.wav):
        // Your .05 · wardrobe .27 · cataloged .90 · searchable 1.61–2.54 ·
        // Favorites 2.59 · filters 3.15 · matches 3.86 · learn 4.47 · style 5.14
        var BEATS = {
          slots: 0.08,
          pills: [0.04, 0.1, 0.16, 0.22],
          cascade: 0.92,
          sweepIn: 2.55,
          sweepOut: 2.97,
          heart: 2.62,
          pair: 3.95,
          plain: 4.45,
          swap: 4.98,
          pillIn: 5.18,
          jitter: 4.6,
        };

        /* ——— Scene 1 (0–0.9s): atmosphere, hairline slot outline, per-word headline ——— */
        // Six empty pill-card slots exist as a hairline vertical grid outline.
        tl.fromTo("#sw-grid-slots", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, BEATS.slots);

        // Floating-pill wallpaper settles in quietly (flat — no shadow).
        var PILLS = [
          { id: "#sw-p1", rot: -12 },
          { id: "#sw-p2", rot: 10 },
          { id: "#sw-p3", rot: -8 },
          { id: "#sw-p4", rot: 12 },
        ];
        PILLS.forEach(function (p, i) {
          tl.fromTo(
            p.id,
            { scale: 0.5, rotation: p.rot * 2.2, opacity: 0 },
            { scale: 1, rotation: p.rot, opacity: 1, duration: 0.4, ease: "power3.out" },
            BEATS.pills[i]
          );
        });

        // Section-headline reveals per-word — dynamic-content-sequencing:
        // each word's window is pre-computed once from its content length
        // (BASE + chars × SEC_PER_CHAR), never recomputed per frame.
        var SEQ = { base: 0.16, perChar: 0.045, min: 0.3, max: 0.55 };
        var WORDS = [
          { id: "#sw-w-your", cue: 0.05, len: 4, axis: "y" },
          { id: "#sw-w-wardrobe", cue: 0.27, len: 8, axis: "x" },
        ];
        WORDS.forEach(function (w) {
          var dur = Math.min(SEQ.max, Math.max(SEQ.min, SEQ.base + w.len * SEQ.perChar));
          var from = w.axis === "y"
            ? { y: 36, opacity: 0, filter: "blur(6px)" }
            : { x: -34, opacity: 0, filter: "blur(6px)" };
          var to = w.axis === "y"
            ? { y: 0, opacity: 1, filter: "blur(0px)" }
            : { x: 0, opacity: 1, filter: "blur(0px)" };
          to.duration = dur;
          to.ease = "power3.out";
          tl.fromTo(w.id, from, to, w.cue);
        });

        /* ——— Scene 2 (0.9–3.9s): center-outward cascade into the grid ——— */
        // Final slot offsets from the grid center (540, 848). Six items begin
        // partially spread (START_PROGRESS 0.3 — a full cluster piles up at 6+),
        // then radiate outward to their slots, center ring first.
        var TILES = [
          { id: "#sw-t3", x: -202, y: 0 },
          { id: "#sw-t4", x: 202, y: 0 },
          { id: "#sw-t1", x: -202, y: -308 },
          { id: "#sw-t2", x: 202, y: -308 },
          { id: "#sw-t5", x: -202, y: 308 },
          { id: "#sw-t6", x: 202, y: 308 },
        ];
        var EXPAND = { entry: BEATS.cascade, stagger: 0.075, dur: 1.15, spread: 0.3 };
        TILES.forEach(function (t, i) {
          tl.fromTo(
            t.id,
            {
              x: t.x * EXPAND.spread,
              y: t.y * EXPAND.spread,
              scale: 0.6,
              opacity: 0,
              transformOrigin: "50% 50%",
            },
            { x: t.x, y: t.y, scale: 1, opacity: 1, duration: EXPAND.dur, ease: "power3.out" },
            EXPAND.entry + i * EXPAND.stagger
          );
        });

        // One-pass traveling glow sweep across the assembled array.
        tl.fromTo("#sw-sweep-glow", { x: -280, y: -130, opacity: 0 }, { x: 0, y: 0, opacity: 0.4, duration: 0.42, ease: "power2.out" }, BEATS.sweepIn);
        tl.to("#sw-sweep-glow", { x: 280, y: 140, opacity: 0, duration: 0.55, ease: "power2.in" }, BEATS.sweepOut);

        // The favorites heart fills jade on the word "Favorites" — the accent
        // marker pops (back.out spring is the sanctioned playful overshoot).
        tl.fromTo("#sw-heart", { scale: 0.72, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.45, ease: "back.out(1.8)" }, BEATS.heart);
        tl.fromTo("#sw-heart", { attr: { fill: "#FFFFFF" } }, { attr: { fill: "#078675" }, duration: 0.4, ease: "power2.out" }, BEATS.heart);

        /* ——— Scene 3 (3.9–7.66s): a pair slides together, the payoff swaps in ——— */
        // On "matches" the filters + matches tiles slide together as a matched pair.
        tl.set("#sw-t6", { zIndex: 6, immediateRender: false }, BEATS.pair);
        tl.fromTo("#sw-t5", { x: -202, y: 308, scale: 1, transformOrigin: "50% 50%" }, { x: -162, y: 308, scale: 1.05, duration: 0.55, ease: "power3.out" }, BEATS.pair);
        tl.fromTo("#sw-t6", { x: 202, y: 308, scale: 1, transformOrigin: "50% 50%" }, { x: 162, y: 308, scale: 1.05, duration: 0.55, ease: "power3.out" }, BEATS.pair);

        // On "that learn" the phrase lands plain…
        tl.fromTo("#sw-style-plain", { y: 46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, BEATS.plain);

        // …then the scale-swap transition: the plain phrase shrinks out
        // (power2.in) while the mint quote-highlight pill pops in (back.out).
        tl.to("#sw-style-plain", { scale: 0.72, opacity: 0, duration: 0.32, ease: "power2.in", transformOrigin: "50% 50%" }, BEATS.swap);
        tl.fromTo("#sw-style-pill", { scale: 0.72, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.4)" }, BEATS.pillIn);

        // Hold: the only aliveness is a subtle deterministic jitter on the grid
        // (sine-wave-loop, onUpdate form — phase 0 starts at sin(0) = 0, so no
        // jump off the pair-slide settle; the last 18% fades the amplitude out).
        var jitEl = document.getElementById("sw-grid-inner");
        var jit = { p: 0 };
        var JIT = { cycles: 1.3, dur: 3.06, fade: 0.18 };
        tl.to(
          jit,
          {
            p: Math.PI * 2 * JIT.cycles,
            duration: JIT.dur,
            ease: "none",
            onUpdate: function () {
              var t = jit.p / (Math.PI * 2 * JIT.cycles);
              var env = t < 1 - JIT.fade ? 1 : (1 - t) / JIT.fade;
              var jx = 2.0 * Math.sin(jit.p) * env;
              var jy = 1.4 * Math.sin(jit.p * 1.31) * env;
              jitEl.style.transform = "translate3d(" + jx.toFixed(2) + "px," + jy.toFixed(2) + "px,0)";
            },
          },
          BEATS.jitter
        );

        tl.seek(0);
      };
      build();
    })();
