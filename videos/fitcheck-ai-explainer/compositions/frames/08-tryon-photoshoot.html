  <script>
    (function () {
      var build = function () {
        if (typeof gsap === "undefined" || !gsap.timeline) {
          setTimeout(build, 20);
          return;
        }

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["08-tryon-photoshoot"] = tl;

        var BEATS = {
          headline: 0.1,
          headStagger: 0.16,
          cardA: 0.5,
          cardB: 0.8,
          figure: 1.5,
          figureDraw: 0.9,
          dress1: 2.0,
          dress2: 2.3,
          photos: 2.7,
          photoStagger: 0.22,
          shutter: 3.2,
          snap: 3.4,
          badgeA: 3.6,
          badgeB: 3.9,
          finn: 4.2,
          jitter: 4.6,
        };

        /* ——— Scene 1 (0–1.4s): the headline reveals per-word on its VO cues ——— */
        var headWords = document.querySelectorAll("#ty-headline .ty-w");
        var headAt = [0.1, 0.18, 0.34, 0.67, 0.85, 1.05];
        for (var h = 0; h < headWords.length; h++) {
          (function (el, at) {
            tl.fromTo(el, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, at);
          })(headWords[h], headAt[h]);
        }

        /* ——— Scene 2 (1.5–3.4s): the paired cards enter from top and bottom wings with mirrored tilts ——— */
        tl.fromTo(
          "#ty-card-a",
          { y: -320, rotationY: -18, transformOrigin: "50% 100%", opacity: 0 },
          { y: 0, rotationY: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
          BEATS.cardA
        );
        tl.fromTo(
          "#ty-card-b",
          { y: 320, rotationY: 18, transformOrigin: "50% 0%", opacity: 0 },
          { y: 0, rotationY: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
          BEATS.cardB
        );

        // Card A: the paper figure draws itself in (svg-path-draw), then the outfit drops on.
        var figPaths = document.querySelectorAll("#ty-figure path, #ty-figure line");
        for (var p = 0; p < figPaths.length; p++) {
          (function (el, idx) {
            tl.to(el, { strokeDashoffset: 0, duration: BEATS.figureDraw, ease: "power2.inOut" }, BEATS.figure + idx * 0.2);
          })(figPaths[p], p);
        }
        tl.fromTo("#ty-dress-1", { y: -80, scale: 0.75, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, BEATS.dress1);
        tl.fromTo("#ty-dress-2", { y: -100, scale: 0.75, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, BEATS.dress2);

        // Card B: the three-frame photo strip blooms (center-outward expansion) from the card's center.
        var photoX = [90, 330, 570];
        var cardBCenterX = 90 + 450;
        var cardBCenterY = 1060 + 190;
        for (var s = 0; s < 3; s++) {
          (function (el, left, idx) {
            var dx = left + 120 - cardBCenterX;
            tl.fromTo(
              el,
              { x: -dx, y: -(110 + 120 - cardBCenterY), scale: 0.25, opacity: 0 },
              { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
              BEATS.photos + idx * BEATS.photoStagger
            );
          })(document.getElementById("ty-photo-" + (s + 1)), photoX[s], s);
        }

        // The shutter pill springs in, then fires a press-release spring.
        tl.fromTo("#ty-shutter", { scale: 0.4, transformOrigin: "50% 50%", opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.7)" }, BEATS.shutter);
        tl.to("#ty-shutter", { scale: 0.86, transformOrigin: "50% 50%", duration: 0.09, ease: "power2.in" }, BEATS.snap);
        tl.to("#ty-shutter", { scale: 1.05, duration: 0.12, ease: "power2.out" }, BEATS.snap + 0.09);
        tl.to("#ty-shutter", { scale: 1, duration: 0.14, ease: "power3.out" }, BEATS.snap + 0.21);

        /* ——— Scene 3 (3.5–7.58s): inner-edge badges spring-pop; Finn peeks in; the pair holds ——— */
        tl.fromTo("#ty-badge-a", { scale: 0.4, rotation: -6, transformOrigin: "50% 50%", opacity: 0 }, { scale: 1, rotation: -3, opacity: 1, duration: 0.3, ease: "back.out(1.7)" }, BEATS.badgeA);
        tl.fromTo("#ty-badge-b", { scale: 0.4, rotation: 6, transformOrigin: "50% 50%", opacity: 0 }, { scale: 1, rotation: 3, opacity: 1, duration: 0.3, ease: "back.out(1.7)" }, BEATS.badgeB);

        // Finn peeks up between the cards (a single bounded rise — no loop).
        tl.fromTo("#ty-finn-inner", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, BEATS.finn);
        tl.to("#ty-finn-inner", { y: -6, duration: 0.2, ease: "power2.out" }, BEATS.finn + 0.45);
        tl.to("#ty-finn-inner", { y: 0, duration: 0.24, ease: "power2.inOut" }, BEATS.finn + 0.65);

        // Hold the read: stillness — only a subtle deterministic jitter on the badges row.
        var badgesEl = document.getElementById("ty-badges");
        var jit = { p: 0 };
        tl.to(
          jit,
          {
            p: Math.PI * 2 * 1.6,
            duration: 7.58 - BEATS.jitter,
            ease: "none",
            onUpdate: function () {
              var x = 1.4 * Math.sin(jit.p);
              var y = 1.0 * Math.sin(jit.p * 1.31);
              badgesEl.style.transform = "translate3d(" + x.toFixed(2) + "px," + y.toFixed(2) + "px,0)";
            },
          },
          BEATS.jitter
        );

        tl.seek(0);
      };
