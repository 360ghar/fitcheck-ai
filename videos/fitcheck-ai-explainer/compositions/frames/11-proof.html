      <div class="pf-card" id="pf-card-1">

    <div class="clip" id="pf-card-3-clip" data-start="0" data-duration="10.45" data-track-index="3">
      <div class="pf-card" id="pf-card-3">
        <div class="pf-stat pf-stat-c2" id="pf-stat-3">40%</div>
        <div class="pf-quote" id="pf-quote-3">

  <script>
    (function () {
      var build = function () {
        if (typeof gsap === "undefined" || !gsap.timeline) {
          setTimeout(build, 20);
          return;
        }

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["11-proof"] = tl;

        var BEATS = {
          card1: 0.1,
          stat1: 0.63,
          hl1: 0.89,
          quote1: 1.5,
          attr1: 2.9,
          cut1: 3.3,
          card2: 3.4,
          stat2: 4.09,
          hl2: 4.66,
          cut2: 5.6,
          card3: 5.7,
          hl3: 6.17,
          stat3: 6.7,
          rePulse: 8.6,
          jitter: 7.5,
        };

        /* ——— Card 1 — Emma (0–3.3s): rises, the numeral lands on "fifty" ——— */
        tl.fromTo(
          "#pf-card-1",
          { y: 60, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
          BEATS.card1
        );
        tl.fromTo("#pf-stat-1", { scale: 0.4, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.4, ease: "back.out(1.6)" }, BEATS.stat1);
        tl.fromTo("#pf-hl-1", { scale: 0.5, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.32, ease: "back.out(1.7)" }, BEATS.hl1);
        tl.fromTo("#pf-quote-1", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, BEATS.quote1);
        tl.fromTo("#pf-attr-1", { y: 12, opacity: 0 }, { y: 0, opacity: 0.7, duration: 0.35, ease: "power3.out" }, BEATS.attr1);

        /* ——— Hard cut → Card 2 — Marcus (3.4–5.6s) ——— */
        tl.set("#pf-card-1", { opacity: 0 }, BEATS.cut1);
        tl.fromTo(
          "#pf-card-2",
          { y: 60, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
          BEATS.card2
        );
        tl.fromTo("#pf-stat-2", { scale: 0.4, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.4, ease: "back.out(1.6)" }, BEATS.stat2);
        tl.fromTo("#pf-hl-2", { scale: 0.5, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.32, ease: "back.out(1.7)" }, BEATS.hl2);
        tl.fromTo("#pf-quote-2", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, BEATS.card2 + 0.15);
        tl.fromTo("#pf-attr-2", { y: 12, opacity: 0 }, { y: 0, opacity: 0.7, duration: 0.35, ease: "power3.out" }, BEATS.card2 + 0.3);

        /* ——— Hard cut → Card 3 — Priya (5.7–10.45s), the chain's long hold ——— */
        tl.set("#pf-card-2", { opacity: 0 }, BEATS.cut2);
        tl.fromTo(
          "#pf-card-3",
          { y: 60, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
          BEATS.card3
        );
        tl.fromTo("#pf-hl-3", { scale: 0.5, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.32, ease: "back.out(1.7)" }, BEATS.hl3);
        tl.fromTo("#pf-quote-3", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, BEATS.hl3 + 0.1);
        tl.fromTo("#pf-stat-3", { scale: 0.4, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.4, ease: "back.out(1.6)" }, BEATS.stat3);
        tl.fromTo("#pf-attr-3", { y: 12, opacity: 0 }, { y: 0, opacity: 0.7, duration: 0.35, ease: "power3.out" }, BEATS.stat3 + 0.25);

        // The closer breathes: one bounded re-pulse of the numeral, then stillness.
        tl.to("#pf-stat-3", { scale: 1.05, transformOrigin: "50% 50%", duration: 0.16, ease: "power2.out" }, BEATS.rePulse);
        tl.to("#pf-stat-3", { scale: 1, duration: 0.3, ease: "power3.out" }, BEATS.rePulse + 0.16);

        // Hold the read: stillness — only a subtle deterministic jitter on the card.
        var card3 = document.getElementById("pf-card-3");
        var jit = { p: 0 };
        tl.to(
          jit,
          {
            p: Math.PI * 2 * 2.2,
            duration: 10.45 - BEATS.jitter,
            ease: "none",
            onUpdate: function () {
              var x = 1.5 * Math.sin(jit.p);
              var y = 1.1 * Math.sin(jit.p * 1.31);
              card3.style.transform = "translate3d(" + x.toFixed(2) + "px," + y.toFixed(2) + "px,0)";
            },
          },
          BEATS.jitter
        );

        tl.seek(0);
      };
      build();
    })();
  </script>
