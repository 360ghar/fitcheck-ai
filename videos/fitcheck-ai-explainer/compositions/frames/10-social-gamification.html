  </style>

  <div
    id="root"
    data-composition-id="10-social-gamification"
    data-start="0"
    data-duration="5.8"
    data-width="1080"
    data-height="1920"
  >
    <!-- atmosphere ground -->
    <div class="clip" id="sg-bg" data-start="0" data-duration="5.8" data-track-index="0">
      <div class="sg-glow sg-glow-a"></div>
      <div class="sg-glow sg-glow-b"></div>
      <div class="sg-glow sg-glow-c"></div>
      <div class="sg-grain"></div>
    </div>

    <!-- the pinned STREAK anchor -->
    <div class="clip" id="sg-anchor-clip" data-start="0" data-duration="5.8" data-track-index="1">
      <div id="sg-anchor">
        <svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="streak flame">
          <path d="M60 8 Q78 34 88 58 Q96 78 88 100 Q80 122 60 124 Q40 122 32 100 Q24 78 32 58 Q42 34 60 8 Z"
            fill="#078675" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round" />
          <path d="M60 48 Q70 62 72 78 Q73 94 60 98 Q47 94 48 78 Q50 62 60 48 Z"
            fill="#74DEC0" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round" />
        </svg>
        <div id="sg-anchor-label">Streak</div>
      </div>

    </div>

    <!-- the cycling state pill -->
    <div class="clip" id="sg-state-clip" data-start="0" data-duration="5.8" data-track-index="2">

    <!-- the leaderboard rail -->
    <div class="clip" id="sg-rail-clip" data-start="0" data-duration="5.8" data-track-index="3">

        </div>

        <div class="sg-row" id="sg-row-3">

  <script>
    (function () {
      var build = function () {
        if (typeof gsap === "undefined" || !gsap.timeline) {
          setTimeout(build, 20);
          return;
        }

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["10-social-gamification"] = tl;

        var STATES = ["Share the fit", "Badge unlocked", "Leaderboard"];
        var BEATS = {
          anchor: 0.1,
          anchorSub: 0.5,
          state: 0.9,
          swap1: 1.15,
          swap2: 1.4,
          rail: 1.75,
          rowStagger: 0.2,
          jitter: 2.5,
        };

        /* ——— Scene 1 (0–0.8s): the pinned anchor enters once and never moves ——— */
        tl.fromTo(
          "#sg-anchor",
          { scale: 0.6, y: 60, opacity: 0 },
          { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.5)" },
          BEATS.anchor
        );
        tl.fromTo("#sg-anchor-sub", { y: 14, opacity: 0 }, { y: 0, opacity: 0.7, duration: 0.35, ease: "power3.out" }, BEATS.anchorSub);

        /* ——— Scene 2 (0.9–1.6s): the state pill cycles through its tokens (hard-cut swaps) ——— */
        tl.fromTo("#sg-state", { scale: 0.5, transformOrigin: "50% 50%", opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, BEATS.state);

        var stateText = document.getElementById("sg-state-text");
        var statePill = document.getElementById("sg-state");
        function swapState(at, text) {
          tl.call(function () { stateText.textContent = text; }, null, at);
          tl.fromTo(statePill, { scale: 0.92 }, { scale: 1, transformOrigin: "50% 50%", duration: 0.18, ease: "power2.out" }, at);
          var halo = statePill.querySelector(".sg-state-halo");
          tl.fromTo(halo, { opacity: 0 }, { opacity: 0.85, duration: 0.12, ease: "power1.out" }, at);
          tl.to(halo, { opacity: 0, duration: 0.3, ease: "power2.out" }, at + 0.12);
        }
        swapState(BEATS.swap1, STATES[1]);
        swapState(BEATS.swap2, STATES[2]);

        /* ——— Scene 3 (1.7–5.3s): the leaderboard rail assembles (center-outward expansion) ——— */
        tl.fromTo("#sg-rail-label", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, BEATS.rail);
        for (var r = 0; r < 3; r++) {
          (function (sel, idx) {
            tl.fromTo(
              sel,
              { scale: 0.3, y: 40, opacity: 0 },
              { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
              BEATS.rail + 0.15 + idx * BEATS.rowStagger
            );
          })("#sg-row-" + (r + 1), r);
        }

        // Hold the read: stillness — only a subtle deterministic jitter on the flame.
        var anchorEl = document.getElementById("sg-anchor");
        var jit = { p: 0 };
        tl.to(
          jit,
          {
            p: Math.PI * 2 * 1.3,
            duration: 5.30 - BEATS.jitter,
            ease: "none",
            onUpdate: function () {
              var x = 1.3 * Math.sin(jit.p);
              var y = 0.9 * Math.sin(jit.p * 1.27);
              anchorEl.style.transform = "translate3d(" + x.toFixed(2) + "px," + y.toFixed(2) + "px,0)";
            },
          },
          BEATS.jitter
        );

        tl.seek(0);
      };
      build();
    })();
  </script>
