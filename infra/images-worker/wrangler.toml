# Wrangler configuration for the FitCheck image-serving Worker.
#
# Fill in the R2 bucket name (must match the backend's OBJECT_STORAGE_BUCKET)
# and the zone for the custom domain, then:
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_JWT_SECRET
#   npx wrangler deploy
#
# Full runbook + verification: README.md in this directory and
# docs/exec-plans/active/2026-08-09-closet-image-url-rca.md.

name = "fitcheck-images"
main = "worker.js"
compatibility_date = "2025-01-01"

# Route for the custom domain (zone must be added to the account first).
[routes]
pattern = "images.fitcheckaiapp.com/*"
zone_name = "fitcheckaiapp.com"

[vars]
# Origins allowed to read an image response cross-origin. Required for the web
# app's download / share buttons (they fetch() the image URL to build a Blob)
# and for the canvas crop, which needs Access-Control-Allow-Origin. Anything not
# listed here gets no CORS header and cannot read the body from JS; plain <img>
# rendering does not need CORS and works regardless.
# Comma-separated, exact origin match (scheme + host + port), no wildcards.
ALLOWED_ORIGINS = "https://www.fitcheckaiapp.com,https://fitcheckaiapp.com,https://admin.fitcheckaiapp.com"

[[r2_buckets]]
binding = "IMAGES_BUCKET"
# Must match the backend's OBJECT_STORAGE_BUCKET (the corpus was migrated
# there in 2026-08-05). Check the current value before deploying.
bucket_name = "fitcheck-images"
