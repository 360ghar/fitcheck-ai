name: fitcheck_ai
description: "AI Wardrobe Organizer & Outfit Planner - Virtual Closet with AI Try-On, Photoshoot Generator & Style Recommendations"
publish_to: 'none'
version: 1.0.4+9

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management & Dependency Injection
  get: ^4.6.6

  # HTTP & Networking
  dio: ^5.7.0
  http: ^1.2.2
  connectivity_plus: ^7.0.0
  app_links: ^6.4.1
  url_launcher: ^6.3.1

  # UI Components
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  # Cache manager type used by CachedNetworkImage (direct dep so AppImage can
  # expose an injectable BaseCacheManager for tests)
  flutter_cache_manager: ^3.4.1
  image_picker: ^1.0.7
  photo_view: ^0.15.0
  flutter_image_compress: ^2.1.0
  gal: ^2.3.0

  # Icons - using community package for remix icons
  # For now, using Material Icons. To use Remix icons, add:
  # https://pub.dev/packages/remixicon
  # or add custom icon font

  # Supabase Auth & Database
  supabase_flutter: ^2.8.4
  sign_in_with_apple: ^6.1.3
  crypto: ^3.0.5
  flutter_secure_storage: ^9.2.4

  # Analytics
  posthog_flutter: ^5.11.1

  # Crash Reporting
  sentry_flutter: ^9.0.0

  # Shorebird code push (OTA patches). Read-only runtime surface: patch number
  # for Sentry/Settings plus an opt-in update check. The updater itself runs
  # regardless of this package - see `auto_update` in shorebird.yaml.
  shorebird_code_push: ^2.0.7

  # Utils
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  package_info_plus: ^9.0.0
  device_info_plus: ^12.3.0
  shared_preferences: ^2.2.2

  # Icons
  cupertino_icons: ^1.0.8

  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # URL launching (platform interface stub in widget tests)
  url_launcher_platform_interface: ^2.3.2

  # In-app purchase (platform interface stub in IAP service tests)
  in_app_purchase_platform_interface: ^1.4.1

  # In-memory file system stub for flutter_cache_manager in widget tests
  # (the default IOFileSystem needs path_provider, which has no test host)
  file: ^7.0.0

  # Icon Generation
  flutter_launcher_icons: ^0.14.3

  # Code Generation
  build_runner: ^2.4.0
  freezed: ^3.2.4
  json_serializable: ^6.7.1
  # Linting
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/
    - shorebird.yaml

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#FF6B6B"
    theme_color: "#FF6B6B"
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true
