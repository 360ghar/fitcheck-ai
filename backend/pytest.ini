[pytest]
; Make `pytest` (without `python -m`) importable from the backend/ root by
; putting this directory on sys.path. Without this, bare `pytest` fails to
; `import app` for every test module (ModuleNotFoundError). `python -m pytest`
; worked only because it prepends the CWD to sys.path implicitly.
pythonpath = .
asyncio_mode = strict
; Async fixtures (tests/api/conftest.py::async_client) are function-scoped:
; every test gets its own event loop and its own client. Explicit value is
; required by pytest-asyncio >= 1.0 when any async fixture exists.
asyncio_default_fixture_loop_scope = function
testpaths = tests
; Single-command run: `pytest` = full suite + branch coverage + the 90% gate
; (fail_under lives in .coveragerc so `--cov-fail-under=0` can relax it for
; iteration). `-p no:cacheprovider` is intentionally NOT set: the cache keeps
; `--lf`/`--ff` fast.
addopts = --cov=app --cov-branch --cov-report=term-missing
; Every test is isolated: no marker may be invented accidentally.
strict_markers = true
markers =
    unit: pure unit tests (no HTTP, no DB) under tests/unit/
    integration: route-level tests with in-memory fakes under tests/integration/
    api: full-app ASGI contract tests under tests/api/
    network: opt-out of the autouse socket-blocking guard (tests/conftest.py)
; Third-party noise only. App-code warnings (e.g. the Pydantic class-config
; deprecation) stay visible on purpose — they are app debt, not test debt.
filterwarnings =
    ignore:The 'timeout' parameter is deprecated.*:DeprecationWarning
    ignore:The 'verify' parameter is deprecated.*:DeprecationWarning
