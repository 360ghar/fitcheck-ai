# FitCheck Admin — Netlify Deployment Configuration
# Deployed to admin.fitcheckaiapp.com

[build]
  command = "npm run build"
  publish = "dist"

# API proxy — forward API requests to the backend (Railway).
# IMPORTANT: This must come before the SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "https://api.fitcheckaiapp.com/api/:splat"
  status = 200
  force = true

# SPA routing — redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
#
# Content-Security-Policy is ACTIVE. The only inline script is the pre-paint
# theme initializer in index.html; it is byte-stable across builds (Vite does
# not minify inline scripts), so a static sha256 hash pins it instead of
# 'unsafe-inline'. If you edit that script, recompute the hash with
# `node scripts/csp-hash.mjs` or the theme script will be blocked.
#
# The admin app is fully authenticated: `frame-ancestors 'none'` + `X-Frame-
# Options: DENY` keep it out of iframes, and the robots meta tag in index.html
# is belt-and-braces on top of this noindex header.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://api.fitcheckaiapp.com https://*.supabase.co; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'sha256-M5uhmt0/GQKIQ9UZ91zfBWgdsvV0G+5irWme7wsq7Qk='; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Hashed assets — content-stable by construction (Vite content hashes).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted font. Content-stable by construction: a different font revision
# is a different file. Safe to mark immutable.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "font/woff2"
