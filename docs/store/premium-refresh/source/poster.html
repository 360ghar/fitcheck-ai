<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitCheck store artwork source</title>
<style>
@font-face { font-family: Bodoni; src: url('fonts/BodoniModa.ttf'); font-weight: 400 900; }
* { box-sizing: border-box; }
html,body { margin:0; overflow:hidden; }
body { color:#2c302d; font-family:Arial,sans-serif; }
#art { position:relative; width:100vw; height:100vh; overflow:hidden; background:var(--field); }
.brand { position:absolute; left:7%; top:3%; margin:0; font:600 52px/1.1 Bodoni,serif; letter-spacing:-1.2px; }
.title { position:absolute; left:7%; right:6%; top:6.6%; margin:0; white-space:pre-line; font:600 112px/1.07 Bodoni,serif; letter-spacing:-2.8px; }
.subtitle { position:absolute; left:7%; top:15.8%; margin:0; font-size:38px; line-height:1.35; }
.screen { position:absolute; left:50%; top:20%; height:77%; width:auto; transform:translateX(-50%); border-radius:30px; box-shadow:0 24px 52px #2c302d1a; display:block; }
.ipad .brand { top:3.2%; font-size:62px; }
.ipad .title { top:7%; font-size:120px; line-height:1.07; white-space:normal; max-width:1760px; }
.ipad .subtitle { top:17.4%; font-size:42px; }
.ipad .screen { top:22%; height:75%; border-radius:32px; }
.play-phone .brand { top:2.7%; font-size:38px; }
.play-phone .title { top:6.2%; font-size:78px; letter-spacing:-1.8px; }
.play-phone .subtitle { display:none; }
.play-phone .screen { top:17.5%; height:79.5%; border-radius:20px; box-shadow:none; }
.dark { color:#f5f5ef; }
.dark .subtitle { color:#bfc6bd; }
.dark .screen { outline:1px solid #485047; }
.raw .screen { inset:0; transform:none; width:100%; height:100%; border-radius:0; box-shadow:none; outline:none; object-fit:contain; }
.raw .brand,.raw .title,.raw .subtitle { display:none; }
.feature { --field:#d7dfd4; }
.feature .brand { left:6.4%; top:12%; font-size:33px; }
.feature .title { left:6.4%; top:27%; font-size:74px; line-height:1.03; letter-spacing:-1.8px; right:auto; }
.feature .subtitle { left:6.4%; top:auto; bottom:16%; font-size:21px; }
.feature .shirt { position:absolute; right:20%; top:7%; height:80%; width:auto; }
.feature .trousers { position:absolute; right:3.5%; top:9%; height:79%; width:auto; }
</style>
<main id="art"></main>
<script>
(async () => {
  const data=await (await fetch('screens.json')).json();
  const q=new URLSearchParams(location.search);
  const art=document.querySelector('#art');
  if(q.get('preset')==='feature') {
    art.className='feature';
    art.innerHTML='<p class="brand">FitCheck AI</p><h1 class="title">Wear what<br>you love.</h1><p class="subtitle">Your closet. Your outfits. Your Studio.</p><img class="shirt" src="../../../../flutter/test/fixtures/garment-ecru-shirt.png" alt="Ecru linen shirt"><img class="trousers" src="../../../../flutter/test/fixtures/garment-charcoal-trousers.png" alt="Charcoal trousers">';
  } else {
    const preset=data.presets.find(p=>p.id===q.get('preset'));
    const screen=data.screens.find(s=>s.id===q.get('screen'));
    if(!preset || !screen) throw Error('Unknown artwork preset or screen');
    const fields={linen:'#e6e4d8',rose:'#e6ded7',slate:'#dde2e3',sage:'#d7dfd4',dark:'#1f2321'};
    art.style.setProperty('--field',fields[screen.field]);
    art.className=preset.layout+(screen.field==='dark'?' dark':'');
    for (const [tag,klass,value] of [['p','brand','FitCheck AI'],['h1','title',screen.title],['p','subtitle',screen.subtitle]]) {
      const node=document.createElement(tag); node.className=klass; node.textContent=value; art.append(node);
    }
    const img=new Image(); img.className='screen'; img.alt=screen.alt;
    img.src=`../raw/${preset.raw}/${screen.id}.png`; art.append(img);
  }
  await document.fonts.ready;
  await Promise.all([...document.images].map(img=>img.decode()));
  window.artworkReady=true;
})().catch(e=>{document.body.dataset.error=e.message; console.error(e);});
</script>
</html>
