    <!-- Brand type. Preloaded because the stylesheet only discovers these after
         it has been fetched and parsed, and Manrope carries .landing-display —
         the <h1> that is the LCP element on mobile. Both are `font-display:
         swap`, so a slow font degrades to a swap rather than blank text. -->
    <link rel="preload" href="/fonts/manrope-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The LCP hero image preload is injected HOMEPAGE-ONLY by
         scripts/prerender-html.mjs (route '/'). It cannot live in this shell,
         which prerender-meta.mjs copies verbatim to every public route —
         otherwise /faq, /features, etc. would all preload a hero image they
         never render. -->

    <!-- Theme initialization - prevents flash of wrong theme -->
    <script>
      (function() {
        var STORAGE_KEY = 'fitcheck-theme';
        var stored = localStorage.getItem(STORAGE_KEY);
        var theme = stored;
        if (!theme || (theme !== 'light' && theme !== 'dark' && theme !== 'system')) {
          theme = 'system';
        }
        var resolved = theme;
        if (theme === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(resolved);
      })();
    </script>
