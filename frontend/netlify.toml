# FitCheck AI - Netlify Deployment Configuration

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Edge Functions for dynamic OG/SEO tags (crawlers)
[[edge_functions]]
  path = "/shared/outfits/*"
  function = "og-tags"

[[edge_functions]]
  path = "/blog/*"
  function = "seo-html"

# Crawler soft-404 guard: unknown public paths get a real 404 + noindex
[[edge_functions]]
  path = "/*"
  function = "not-found"

# API proxy - forward API requests to backend (Railway)
# IMPORTANT: This must come before the SPA fallback
[[redirects]]
  from = "/api/*"
  to = "https://api.fitcheckaiapp.com/api/:splat"
  status = 200
  force = true

# SPA routing - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Authenticated app routes: robots.txt already disallows them; belt-and-braces noindex
[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/wardrobe/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/outfits/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/calendar/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/recommendations/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/try-on/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/photoshoot/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/profile/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/settings/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/auth/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache static SEO files
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain"

# LLM-friendly markdown mirrors of public pages (llms.txt spec: page.md)
[[headers]]
  for = "/*.md"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/markdown"

# IndexNow verification key (Bing/Copilot/Seznam/Naver instant indexing)
[[headers]]
  for = "/.well-known/indexnow/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain"

# OG images
[[headers]]
  for = "/og-*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Content-Type = "image/svg+xml"

[[headers]]
  for = "/og-*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Content-Type = "image/jpeg"

# Promo video
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

