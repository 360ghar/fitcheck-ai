name: Docs link check (lychee)

on:
  schedule:
    # Weekly, Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      # The job also scans these root files (and the ignore list itself), so
      # pushes touching them must trigger the same feedback.
      - 'README.md'
      - 'AGENTS.md'
      - 'ARCHITECTURE.md'
      - '.lycheeignore'

permissions:
  contents: read

jobs:
  lychee:
    name: Check external links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Pinned to the v4 tag's commit SHA (mutable tags can be retargeted
        # upstream); persist-credentials disabled — this job only reads.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run lychee
        # Pinned to the v2 tag's commit SHA.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # --no-fail: broken links are reported (annotations + summary),
          # not blocking, until the ignore list is dialed in.
          args: --no-fail --verbose --max-retries 2 --exclude-file .lycheeignore docs README.md AGENTS.md ARCHITECTURE.md
          fail: false
