name: Build iOS IPA

# ==============================================================================
# WS5 - iOS build/CI pipeline for FitCheck AI (Flutter app under ./flutter)
# ------------------------------------------------------------------------------
# This workflow mirrors the secrets/structure of .github/workflows/build-apk.yml
# (the Android pipeline) and adds the iOS-specific code-signing + TestFlight
# upload plumbing.
#
# ------------------------------------------------------------------------------
# SHOREBIRD CODE PUSH - WHY THIS BUILDS WITH `shorebird release` NOT `flutter build`
# ------------------------------------------------------------------------------
# Only a binary produced by `shorebird release` contains the Shorebird engine.
# An IPA built by plain `flutter build ipa` can NEVER receive an over-the-air
# Dart patch, no matter what is done afterwards. Since this workflow is the
# real App Store / TestFlight path, it is also the Shorebird release path -
# otherwise we would ship builds that look fine and then silently cannot be
# hotfixed.
#
# Consequences that must be preserved when editing this file:
#   * Shorebird vendors its own Flutter fork, so subosito/flutter-action is
#     deliberately NOT used here. Two Flutter installs on one runner is the
#     documented cause of "Invalid Podfile file" / FLUTTER_ROOT mismatches.
#   * `--flutter-version` is pinned to the same version the other workflows use.
#     A release's Flutter version can never be changed by a patch.
#   * `--no-tree-shake-icons` must match flutter/scripts/_shorebird_common.sh and
#     the patch workflow, or patches are rejected as asset diffs.
#   * ExportOptions must NOT set manageAppVersionAndBuildNumber. If Xcode
#     auto-increments the build number on upload, the shipped binary stops
#     matching the recorded release version and patches never resolve.
#   * Patches are shipped by .github/workflows/shorebird-patch-ios.yml, which
#     must reproduce this build exactly (same .env, same signing, same flags).
#
# WHY manual + tags only (not "push: main"):
#   iOS builds run on macOS runners which are slow and billed at ~10x the
#   Linux minute rate. We therefore gate them to explicit, intentional runs:
#   manual dispatch and version tags (v*). The Android APK workflow still runs
#   on every push/PR for fast feedback.
#
# ------------------------------------------------------------------------------
# REQUIRED GITHUB SECRETS
# ------------------------------------------------------------------------------
# App configuration (SHARED with the Android APK workflow - already exist):
#   SUPABASE_URL                     - Supabase project URL
#   SUPABASE_ANON_KEY                - Supabase anon/public key
#   API_BASE_URL                     - Backend base URL (Railway prod URL)
#   POSTHOG_API_KEY                  - PostHog project API key (optional)
#   POSTHOG_HOST                     - PostHog host (e.g. https://app.posthog.com)
#   SENTRY_DSN                       - Sentry DSN for crash reporting (optional)
#
# Sentry symbolication (optional - enables dSYM upload to Sentry):
#   SENTRY_AUTH_TOKEN                - Sentry auth token with project:write scope.
#   SENTRY_ORG                       - Sentry organization slug.
#   SENTRY_PROJECT                   - Sentry project slug.
#
# iOS code signing (NEW - must be created in the Apple Developer account):
#   APPLE_CERT_P12_BASE64            - Base64 of the Apple Distribution .p12
#                                      (cert + private key) exported from Keychain.
#   APPLE_CERT_PASSWORD              - Password protecting the .p12 export.
#   APPLE_PROVISIONING_PROFILE_BASE64- Base64 of the App Store provisioning
#                                      profile (.mobileprovision) for the bundle
#                                      id com.fitcheckaiapp.fitcheckai.
#   KEYCHAIN_PASSWORD                - (OPTIONAL) Password for the temp CI
#                                      keychain. Defaults to a random value if
#                                      unset; only needs to be set if you want a
#                                      stable value. Safe to omit.
#
# App Store Connect API (NEW - for TestFlight upload):
#   APP_STORE_CONNECT_KEY_ID         - The Key ID of the App Store Connect API
#                                      key (e.g. ABCD1234EF).
#   APP_STORE_CONNECT_ISSUER_ID      - The Issuer ID (UUID) shown on the App
#                                      Store Connect "Keys" page.
#   APP_STORE_CONNECT_API_KEY_BASE64 - Base64 of the AuthKey_XXXXXXXXXX.p8 file
#                                      downloaded when the API key was created.
#
# Shorebird code push (NEW - required for the release to be patchable):
#   SHOREBIRD_TOKEN                  - API key from console.shorebird.dev ->
#                                      Account -> API Keys -> Create API Key.
#                                      (`shorebird login:ci` is deprecated; its
#                                      tokens stop working in September 2026.)
#
# ------------------------------------------------------------------------------
# MANUAL PREREQUISITES (must be done ONCE before this workflow can fully succeed)
# ------------------------------------------------------------------------------
#   1. Enrol in the Apple Developer Program (paid) and create the app record in
#      App Store Connect with bundle id `com.fitcheckaiapp.fitcheckai`.
#   2. Create an "Apple Distribution" signing certificate, export it from
#      Keychain Access as a .p12 (with private key), and base64 it for
#      APPLE_CERT_P12_BASE64 / APPLE_CERT_PASSWORD.
#   3. Create an "App Store" provisioning profile for the bundle id, download
#      the .mobileprovision, and base64 it for APPLE_PROVISIONING_PROFILE_BASE64.
#   4. In App Store Connect > Users and Access > Integrations > App Store
#      Connect API, generate an API key with the "App Manager" role. Save the
#      Key ID, Issuer ID, and the one-time .p8 download for the
#      APP_STORE_CONNECT_* secrets above.
#   5. Set DEVELOPMENT_TEAM / signing identity below to match your team's
#      values (see the `env` block) so the generated ExportOptions.plist is
#      correct. The Runner target in project.pbxproj currently uses
#      CODE_SIGN_STYLE = Automatic; this workflow exports with manual signing.
#
# If the signing/ASC secrets are not yet configured, the build steps that need
# them are guarded so the workflow still produces and uploads an unsigned-path
# attempt's artifacts where possible, and the upload step is skipped instead of
# failing the whole run.
# ==============================================================================

on:
  # Manual run from the Actions tab.
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload the built IPA to TestFlight (requires ASC secrets)'
        required: false
        default: true
        type: boolean
  # Version tags only (e.g. v1.0.3). Intentionally NOT on push to main.
  push:
    tags:
      - 'v*'

env:
  # Keep in lock-step with .github/workflows/build-apk.yml,
  # .github/workflows/flutter-ci.yml, .github/workflows/shorebird-patch-ios.yml
  # and flutter/scripts/_shorebird_common.sh.
  FLUTTER_VERSION: '3.44.6'
  # Authenticates the Shorebird CLI. Absent on forks (and before the secret is
  # provisioned). When absent, the auth check is skipped and the unsigned
  # validation path degrades to a warning: every `shorebird` command needs a
  # token, so no dry-run is attempted.
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
  # Bundle identifier from flutter/ios/Runner.xcodeproj/project.pbxproj
  BUNDLE_ID: com.fitcheckaiapp.fitcheckai
  # Apple Developer Team ID used for manual signing in the export step.
  # Matches flutter/ios/ExportOptions.plist teamID.
  DEVELOPMENT_TEAM: HMWGCVU4SV
  # Code signing identity for distribution builds.
  SIGNING_IDENTITY: 'Apple Distribution'

jobs:
  build-ios:
    name: Build iOS IPA
    # macOS runner is required for Xcode. Xcode 26 (required for App Store /
    # TestFlight uploads per the note below) needs macOS 15+, so this must stay
    # at macos-15 or newer.
    runs-on: macos-15
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # App Store Connect rejects IPAs whose MinimumOSVersion is below 15.0
      # (enforced starting Spring 2027). Fail fast here so a non-compliant
      # deployment target can never reach the build/upload steps.
      # `python3`, not `python`: this job has no actions/setup-python step (the
      # script is stdlib-only and needs none), and the runner images ship only
      # `python3` on PATH. Bare `python` here exited 127 and, as the first real
      # step in the job, blocked every iOS build.
      - name: Check iOS deployment target >= 15.0
        run: python3 ../scripts/check_ios_deployment_target.py

      # Select a recent Xcode. NOTE: As of 2026-04-28 the App Store / TestFlight
      # require apps to be built with Xcode 26 (iOS 26 SDK). Xcode 26 requires
      # macOS 15+, hence the macos-15 runner above. 'latest-stable' resolves to
      # the newest Xcode on the runner image (26.x); pin an explicit version
      # (e.g. '26.0') here if builds must be reproducible across image updates.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      # Installs the Shorebird CLI, which vends its own patched Flutter fork.
      # Deliberately replaces subosito/flutter-action: a second Flutter install
      # on the same runner rewrites ios/Flutter/Generated.xcconfig with a
      # conflicting FLUTTER_ROOT and breaks the CocoaPods step.
      # `shorebird release` runs `flutter pub get` and `pod install` itself.
      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      # Fail fast and legibly WHEN the token is provisioned: the CLI would
      # otherwise die partway through a multi-minute Xcode build with an opaque
      # auth error, and there is no bare-`flutter` fallback on this runner (the
      # only Flutter here is Shorebird's vendored fork, reachable only through
      # the authenticated CLI).
      # Skipped when SHOREBIRD_TOKEN is unset (forks / pre-provisioning): the
      # "Validate iOS build (no signing secrets)" step below handles that case
      # by degrading to a warning instead of failing the run. Gated on the
      # secret itself so a fork with an empty-string secret gets the same
      # treatment as a fork with no secret at all.
      - name: Verify Shorebird authentication
        if: ${{ secrets.SHOREBIRD_TOKEN != '' }}
        run: |
          set -euo pipefail
          shorebird account whoami

      # Recreate the .env asset EXACTLY as the Android APK workflow does. The app
      # bundles flutter/.env as a Flutter asset (see pubspec.yaml `assets: - .env`).
      # Only publishable/client keys — never service-role or secret API keys.
      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> .env
          echo "POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}" >> .env
          echo "POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env

      # NOTE: there is intentionally no `flutter pub get` or `pod install` step.
      # Both need a Flutter SDK on PATH, and the only Flutter here belongs to
      # Shorebird. `shorebird release`/`shorebird patch` run pub get and drive
      # CocoaPods as part of the iOS build, and ios/Podfile.lock is committed so
      # pod versions stay pinned without `--repo-update`.

      # ----------------------------------------------------------------------
      # Code signing: import the distribution cert (.p12) and the provisioning
      # profile into a temporary keychain. This uses the standard inline
      # `security` pattern (equivalent to apple-actions/import-codesign-certs).
      # Guarded by `if:` so a fork/no-secrets run skips signing and still
      # exercises the rest of the pipeline.
      # ----------------------------------------------------------------------
      - name: Import code signing assets
        id: signing
        if: ${{ secrets.APPLE_CERT_P12_BASE64 != '' && secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KC_PW="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 24)}"

          # Decode secrets to files.
          echo -n "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo -n "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          # Create and unlock a temporary keychain.
          security create-keychain -p "$KC_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN_PATH"

          # Import the distribution certificate.
          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Allow codesign/xcodebuild to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KEYCHAIN_PATH"

          # Make the temp keychain the default search list (keep login keychain too).
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Install the provisioning profile where Xcode looks for it.
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          # Extract the profile UUID so the ExportOptions can reference it by name.
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" \
            | plutil -extract UUID raw -o - -)
          cp "$PROFILE_PATH" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"

          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "Imported certificate and profile UUID $PROFILE_UUID"

      # Generate ExportOptions.plist at runtime (we do not own ios/ in the repo,
      # so we write it to the runner temp dir instead of committing a file).
      - name: Generate ExportOptions.plist
        id: export_opts
        if: ${{ steps.signing.outputs.signed == 'true' }}
        run: |
          set -euo pipefail
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${DEVELOPMENT_TEAM}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>${SIGNING_IDENTITY}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${{ steps.signing.outputs.profile_uuid }}</string>
            </dict>
            <key>uploadSymbols</key>
            <false/>
            <key>uploadBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF
          # DO NOT add <key>manageAppVersionAndBuildNumber</key><true/> here.
          # Xcode would then bump the build number during export, so the shipped
          # binary's version would no longer match the version Shorebird
          # recorded for this release, and every patch would fail to resolve.
          echo "export_plist=$EXPORT_PLIST" >> "$GITHUB_OUTPUT"
          echo "Generated ExportOptions.plist at $EXPORT_PLIST"
          cat "$EXPORT_PLIST"

      # SIGNED build path: creates a patchable Shorebird release and exports an
      # App Store IPA using the generated ExportOptions.plist (manual signing).
      # dart-defines mirror the .env asset so release never falls back to
      # localhost; they are passed as first-class Shorebird options (Shorebird
      # forwards them to the Flutter build and records them on the release, so
      # patches inherit the same values).
      #
      # Flags after `--` go straight to `flutter build`. Keep --no-tree-shake-icons
      # identical here and in shorebird-patch-ios.yml.
      - name: Build signed IPA (App Store, Shorebird release)
        id: shorebird_release
        if: ${{ steps.signing.outputs.signed == 'true' }}
        run: |
          set -euo pipefail
          shorebird release ios \
            --flutter-version="${FLUTTER_VERSION}" \
            --export-options-plist="${{ steps.export_opts.outputs.export_plist }}" \
            --dart-define=API_BASE_URL="${{ secrets.API_BASE_URL }}" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}" \
            --dart-define=POSTHOG_HOST="${{ secrets.POSTHOG_HOST }}" \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            -- --no-tree-shake-icons

      # UNSIGNED validation path (no Apple secrets, e.g. a fork). With a
      # SHOREBIRD_TOKEN present, --dry-run compiles and validates but uploads
      # nothing, so a run without signing credentials can never create a junk
      # release on the Shorebird account.
      # NOTE: the dry-run is NOT a no-API path — every `shorebird` command
      # authenticates first (see flutter/scripts/_shorebird_common.sh
      # `shorebird_preflight`, which dies unless `shorebird account whoami`
      # succeeds), so this branch still requires the token. Without a token (a
      # fork has no secrets at all, and this job's only Flutter SDK is
      # Shorebird's vendored fork, reachable only through the authenticated
      # CLI), the step degrades to a warning and skips build validation
      # instead of failing the run.
      - name: Validate iOS build (no signing secrets)
        if: ${{ steps.signing.outputs.signed != 'true' }}
        run: |
          set -euo pipefail
          if [ -n "${SHOREBIRD_TOKEN:-}" ]; then
            shorebird release ios --dry-run --no-codesign \
              --flutter-version="${FLUTTER_VERSION}" \
              --dart-define=API_BASE_URL="${{ secrets.API_BASE_URL }}" \
              --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
              --dart-define=POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}" \
              --dart-define=POSTHOG_HOST="${{ secrets.POSTHOG_HOST }}" \
              --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
              -- --no-tree-shake-icons
          else
            echo "::warning::SHOREBIRD_TOKEN is not set (expected on a fork or before" \
                 "the secret is provisioned). Skipping Shorebird dry-run build" \
                 "validation: the CLI cannot authenticate without a token and there" \
                 "is no bare Flutter SDK on this runner."
            echo "No release is created and no artifact is produced by this path."
          fi

      - name: Locate build outputs
        id: outputs
        run: |
          set -euo pipefail
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" 2>/dev/null | head -n1 || true)
          echo "ipa_path=${IPA_PATH}" >> "$GITHUB_OUTPUT"
          if [ -n "${IPA_PATH}" ]; then
            echo "Found IPA: ${IPA_PATH} ($(du -h "${IPA_PATH}" | cut -f1))"
          else
            echo "No .ipa produced (expected for the --no-codesign path)."
          fi

      # ----------------------------------------------------------------------
      # Upload dSYMs to Sentry for crash symbolication.
      #
      # ExportOptions sets uploadSymbols=false: sentry_flutter pulls the static
      # Sentry SPM xcframework, Xcode embeds a stub Sentry.framework with a
      # unique UUID that has no matching dSYM, and Apple's uploadSymbols
      # validation then fails distribute/export. Disabling Apple symbol upload
      # unblocks App Store export; Sentry still gets real dSYMs via sentry-cli.
      #
      # Guarded so it only runs when the Sentry auth secrets exist.
      # continue-on-error so a symbolication failure never blocks the release.
      # ----------------------------------------------------------------------
      - name: Upload dSYMs to Sentry
        continue-on-error: true
        if: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          # Install sentry-cli if the runner image does not already ship it.
          if ! command -v sentry-cli >/dev/null 2>&1; then
            curl -sL https://sentry.io/get-cli/ | bash
          fi

          ARCHIVE_DSYMS="build/ios/archive/Runner.xcarchive/dSYMs"
          SPM_ARTIFACTS="build/ios/SourcePackages/artifacts"

          # Upload the archive dSYMs (app + framework dSYMs copied into it).
          if [ -d "${ARCHIVE_DSYMS}" ]; then
            echo "Uploading archive dSYMs from ${ARCHIVE_DSYMS}"
            sentry-cli debug-files upload "${ARCHIVE_DSYMS}"
          fi

          # Upload the SPM binary xcframework dSYMs (e.g. Sentry.framework.dSYM)
          # which live outside the archive. sentry-cli matches them by UUID for
          # server-side symbolication.
          if [ -d "${SPM_ARTIFACTS}" ]; then
            echo "Uploading SPM artifact dSYMs from ${SPM_ARTIFACTS}"
            sentry-cli debug-files upload "${SPM_ARTIFACTS}"
          fi

      # ----------------------------------------------------------------------
      # Upload to TestFlight using the App Store Connect API key with
      # `xcrun altool --upload-app` (deprecated by Apple in favor of
      # iTMSTransporter / Transporter; still shipped with Xcode 26 — migrate
      # when altool is removed from Xcode). Guarded so it only runs when a
      # signed .ipa exists AND the ASC secrets are present AND (for manual runs)
      # the user opted in. Marked continue-on-error so a transient ASC failure
      # does not discard the already-built artifact.
      # ----------------------------------------------------------------------
      - name: Upload to TestFlight
        id: testflight
        continue-on-error: true
        if: >-
          steps.signing.outputs.signed == 'true' &&
          steps.outputs.outputs.ipa_path != '' &&
          secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' &&
          (github.event_name != 'workflow_dispatch' || inputs.upload_to_testflight)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          # altool looks for the key at one of the private_keys search paths:
          #   ./private_keys, ~/private_keys, ~/.private_keys,
          #   ~/.appstoreconnect/private_keys
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" \
            | base64 --decode > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          xcrun altool --upload-app \
            -f "${{ steps.outputs.outputs.ipa_path }}" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Build summary
        if: ${{ always() }}
        run: |
          {
            echo "## iOS Build Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| App Name | FitCheck AI |"
            echo "| Bundle ID | ${BUNDLE_ID} |"
            echo "| Build Type | Release |"
            echo "| Flutter Version | ${FLUTTER_VERSION} |"
            echo "| Signed | ${{ steps.signing.outputs.signed == 'true' && 'yes' || 'no (no signing secrets)' }} |"
            echo "| Shorebird release | ${{ steps.signing.outputs.signed == 'true' && 'created (patchable)' || 'not created (unsigned path)' }} |"
            echo "| IPA | ${{ steps.outputs.outputs.ipa_path != '' && steps.outputs.outputs.ipa_path || 'not produced' }} |"
            echo "| TestFlight upload | ${{ steps.testflight.outcome || 'skipped' }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Ref | ${{ github.ref_name }} |"
            echo "| Triggered By | ${{ github.actor }} |"
            if [ "${{ steps.signing.outputs.signed }}" = 'true' ]; then
              echo ""
              echo "Dart-only hotfixes for this build ship via the **Shorebird Patch (iOS)** workflow."
              echo "Do not change the version or build number in App Store Connect - patches resolve against it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Always upload whatever IPA was produced as a workflow artifact.
      - name: Upload IPA artifact
        if: ${{ steps.outputs.outputs.ipa_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fitcheck-ai-release-ipa
          path: flutter/build/ios/ipa/*.ipa
          retention-days: 30
          if-no-files-found: warn
