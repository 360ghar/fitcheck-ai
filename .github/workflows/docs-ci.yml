name: Docs & Architecture Harness

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  harness:
    name: Docs structure + architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Pinned to the v4 tag's commit SHA (mutable tags can be retargeted
        # upstream); persist-credentials disabled — this job only reads.
        # fetch-depth: 0 is required: check_docs_structure.py computes each
        # doc's last-commit date via `git log -- <path>`, which a shallow
        # clone cannot do (it would report the tip commit for every file).
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Check docs structure
        run: python scripts/check_docs_structure.py

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Lint markdown
        run: npx --yes markdownlint-cli2 --config .markdownlint.json "docs/**/*.md" "AGENTS.md" "ARCHITECTURE.md" "README.md"

      - name: Check architecture layers
        run: python scripts/check_architecture.py
