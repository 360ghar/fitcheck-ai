name: Flutter Analyze & Test

# Fast feedback job, independent of the slower APK/IPA build workflows.
# Neither build-apk.yml nor build-ios.yml runs `flutter analyze`/`flutter test`,
# so a broken test or analyzer error could previously merge to main unnoticed.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # App Store Connect rejects IPAs whose MinimumOSVersion is below 15.0
      # (enforced starting Spring 2027). Fail fast on a regression before
      # spending runner minutes on analyze/test.
      # `python3`, not `python`: no actions/setup-python step in this job and the
      # runner images ship only `python3` on PATH (bare `python` exits 127).
      - name: Check iOS deployment target >= 15.0
        run: python3 ../scripts/check_ios_deployment_target.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # pubspec.yaml lists `.env` as an asset; it is gitignored and not present
      # on CI. Create a placeholder so analyze/test can build the asset bundle.
      - name: Create placeholder .env asset
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Analyze
        # Only true analyzer errors fail the build for now - the repo has ~546
        # pre-existing info/warning-level issues (mostly `withOpacity`
        # deprecation notices) that are tracked separately as tech debt rather
        # than gating every PR on a pre-existing backlog unrelated to the change.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test
